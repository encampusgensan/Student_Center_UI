# vappfe/nginx.conf
#
# Serves the Angular build inside this container. SPA fallback is
# required for client-side routes like /qrcode and /your-qr/:guid —
# without it, a hard refresh on those routes 404s instead of loading
# the Angular router.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular's bundle is ~1.3MB uncompressed — gzip cuts JS/CSS
    # transfer size significantly, which matters most over WiFi.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (outputHashing: "all" in angular.json) are
    # safe to cache aggressively — a new build produces new filenames.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}